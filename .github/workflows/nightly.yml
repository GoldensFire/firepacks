# Ночной обход базы — тот же самый, что дома, только без домашнего компьютера.
#
# Что происходит каждую ночь: сюда приезжает база, индексатор обходит обсуждения
# ВК (новые паки, переписанные сообщения, перезалитые файлы), обновляет статистику
# и уровни сложности, размечает новичков через Gemini, выкладывает изменившееся
# в Cloudflare — и увозит базу обратно на полку.
#
# Чего здесь нарочно нет: первого разбора двенадцати тысяч паков. Он качает
# и распаковывает многомегабайтные архивы, и делать его надо один раз дома,
# обычным `npm run index`. Сюда попадает уже разобранная база, а ночная работа
# после этого — несколько десятков новых паков и обновление чисел.
#
# Где между ночами лежит база: приложением к отметке релиза «state» в этом же
# репозитории (см. scripts/state.js). Ключей для этого не нужно — у Actions
# есть свой пропуск в собственный репозиторий.
#
# Какие ключи нужны и как их положить — в README, раздел про ночной обход.
# Здесь их нет и быть не может: они лежат в секретах репозитория.

name: Ночной обход базы

on:
  schedule:
    # 8:30 UTC — вскоре после того, как Google обнуляет суточную квоту Gemini.
    #
    # Здесь стояла полночь по Москве (21:00 UTC), и выбрана она была по слову
    # «ночной» в названии. Слово это про сон людей, а обход упирается не в людей,
    # а в суточный предел Gemini, и предел этот считается по тихоокеанским
    # суткам: сбрасывается в полночь по Лос-Анджелесу (см. quotaDay
    # в src/models.js). Полночь по Москве — это два часа дня в Лос-Анджелесе,
    # то есть середина чужих суток, и к этому часу пятьсот запросов дня обычно
    # потрачены — дневными домашними прогонами, до которых ночь просто
    # не дотягивается. Так прошла ночь на 19 августа 2026: двадцать четыре
    # запроса, все в отказ по лимиту, два размеченных пака за двадцать минут
    # при восьми тысячах в очереди.
    #
    # Теперь обход приходит первым, а не последним: 8:30 UTC — это полчаса
    # после сброса зимой (полночь PST = 8:00 UTC) и полтора часа после сброса
    # летом (полночь PDT = 7:00 UTC). Одна строка на весь год, и в обе половины
    # года она позже сброса, а не раньше.
    #
    # Ночью по местным часам это быть перестало, и «ночной» осталось только
    # в названии. Взамен ночь получила то, ради чего она есть, — целые сутки
    # квоты, из которых до неё доходили крохи.
    #
    # Расписание в GitHub — обещание, а не будильник: при общей загрузке запуск
    # сдвигается на десяток-другой минут. Для обхода это безразлично — на то
    # и взят получасовой запас после сброса.
    - cron: '30 8 * * *'

  # Тот же обход руками — со страницы Actions. Пригождается, чтобы проверить
  # ключи, не дожидаясь ночи, или догнать пропущенный день.
  workflow_dispatch:
    inputs:
      steps:
        description: 'Шаги через запятую (vk, parse, stats, topics, summary, logos, specials, recalc). Пусто — обычный ночной набор.'
        required: false
        default: ''
      deploy:
        description: 'Выкладывать результат на сайт'
        type: boolean
        default: true
      minutes:
        description: 'Сколько минут отпущено обходу вместе с выкладкой. Пусто — 240.'
        required: false
        default: ''

# Двум обходам разом делать нечего: они возьмут одну и ту же базу с полки,
# и тот, кто закончит вторым, затрёт работу первого. В той же очереди стоит
# и ежечасный обход за новыми паками (hourly.yml): база у них одна на двоих,
# и работать по ней одновременно нельзя ни при каких условиях.
concurrency:
  group: firepacks-state
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest

    # Предохранитель, а не расписание. Своё время обход считает сам и уходит
    # с запасом на выкладку (см. BUDGET_DEFAULT в scripts/nightly.js) — до этого
    # числа дело доходить не должно вовсе.
    #
    # Раньше здесь стояло 320 минут, и они были не предохранителем, а способом
    # закончить работу: обход шёл, пока его не убьют. Убивало ровно на этом
    # числе, посреди запроса, — и всё, что стоит после обхода (выкладка, отчёт),
    # не выполнялось. Две ночи подряд, 16 и 17 августа 2026, прошли именно так:
    # по две тысячи размеченных паков за ночь, ни одного на сайте.
    timeout-minutes: 330

    permissions:
      # Нужно ровно одно: перезаписать приложение к отметке релиза.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Чем уменьшать обложки. Нужно редко — только для паков, разобранных
      # этой же ночью: готовые копии приезжают вместе с базой (см. build-web.js).
      #
      # Ограничено по времени и не имеет права уронить ночь, и это не
      # перестраховка. В ночь на 20 августа 2026 эта самая строчка провисела
      # пять с половиной часов — apt ждал чужой замок молча и бесконечно, —
      # после чего GitHub убил задание по предохранителю ниже. Индексатор в ту
      # ночь не запускался вовсе: ни одного размеченного пака, ни одной новой
      # строки на сайте, и в отчёте пусто, потому что отчёт пишет тот, кто
      # так и не начал.
      #
      # Отсюда три вещи разом. Замок теперь ждётся две минуты, а не вечность
      # (DPkg::Lock::Timeout). Вопросов apt не задаёт (DEBIAN_FRONTEND) —
      # спросить ему здесь всё равно некого. А если он всё-таки встанет,
      # через десять минут его снимут и ночь пойдёт дальше: уменьшать обложки
      # будет нечем, но это стоит нескольких паков без картинки, а не всей ночи.
      - name: Поставить ImageMagick
        timeout-minutes: 10
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -o DPkg::Lock::Timeout=120 update -qq
          sudo -E apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends imagemagick ffmpeg

      - run: npm ci

      # Проверяем заранее, чтобы не узнать о нехватке ключа через полтора часа,
      # на самом последнем шаге. Ни один ключ здесь не обязателен, и падать
      # из-за нехватки нечего:
      #
      #   без ВК и Gemini обход просто беднее — обсуждения читаются разбором
      #   страниц, разметка новых паков откладывается до следующего раза;
      #
      #   без ключей Cloudflare не будет выкладки, но собранное не пропадёт:
      #   база уедет на полку, а заливка ведётся не «всё заново каждую ночь»,
      #   а по отпечаткам строк — и первая же удачная выкладка увезёт наверх
      #   всё, что накопилось за пропущенные ночи (см. scripts/export-d1.js).
      #
      # Поэтому не хватает ключа — говорим об этом заметно и идём дальше.
      - name: Проверить, что ключи на месте
        id: keys
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          for name in VK_TOKEN GEMINI_API_KEY; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then echo "::warning::Ключа $name нет — обход пойдёт без него"; fi
          done

          if [ "$DEPLOY" = "false" ]; then
            echo "Выкладки не будет: так попросили при запуске."
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done

          if [ -n "$missing" ]; then
            echo "::warning::Выкладывать нечем — нет:$missing. База соберётся и ляжет на полку, но сайт останется вчерашним."
            {
              echo '### Сайт не обновлён'
              echo
              echo "В секретах репозитория нет:$missing"
              echo
              echo 'Ключ заводится на dash.cloudflare.com → My Profile → API Tokens →'
              echo 'Create Token → шаблон **Edit Cloudflare Workers**, и в правах добавить **D1 → Edit**.'
              echo
              echo '```'
              echo "gh secret set CLOUDFLARE_API_TOKEN --repo ${{ github.repository }}"
              echo '```'
              echo
              echo 'Собранное не пропало: заливка идёт по отпечаткам строк, и первая же'
              echo 'удачная ночь увезёт наверх всё, что накопилось за пропущенные.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Ключи Cloudflare на месте."
          echo 'deploy=true' >> "$GITHUB_OUTPUT"

      - name: Забрать базу с полки
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --no-warnings scripts/state.js pull

      - name: Обойти базу и выложить
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Через переменные, а не подстановкой в саму команду: то, что пришло
          # из формы запуска, в строку оболочки попадать не должно.
          STEPS: ${{ inputs.steps }}
          MINUTES: ${{ inputs.minutes }}
          # Не то, что просили при запуске, а то, что вышло по ключам: шаг выше
          # мог отменить выкладку, не найдя чем выкладывать.
          DEPLOY: ${{ steps.keys.outputs.deploy }}
        run: |
          args=""
          if [ -n "$STEPS" ]; then args="--steps=$STEPS"; fi
          if [ -n "$MINUTES" ]; then args="$args --minutes=$MINUTES"; fi
          if [ "$DEPLOY" != "true" ]; then args="$args --no-deploy"; fi
          node --no-warnings scripts/nightly.js $args

      # Кладём базу обратно в любом случае — даже если обход оборвался на середине.
      # Разобранное до обрыва — это работа, которую не надо делать заново; а вот
      # если база даже не приехала, класть на полку нечего, и трогать лежащее там
      # нельзя ни в коем случае.
      #
      # Без --force, и это правка по живому случаю. Раньше здесь стояло «затереть
      # полку чем есть»: считалось, что за ночь её всё равно никто не трогает.
      # Трогают — домашняя машина, когда там доводят разметку и выкладывают
      # сделанное на сайт. Ночь брала полку в начале, четыре часа работала
      # и клала свою копию поверх, а вместе с ней возвращала на полку то самое
      # состояние, из которого дома уже ушли вперёд.
      #
      # Теперь push при разошедшейся полке не затирает её, а сливает: чужая
      # разметка переносится сюда, и наверх уезжает то и другое разом
      # (см. mergeShelf в scripts/state.js). Отказаться и ничего не положить
      # он при этом всё равно не может — этого мы и боялись, когда ставили здесь
      # --force, — так что ночь по-прежнему кладёт свою работу в любом случае.
      - name: Вернуть базу на полку
        if: always() && steps.state.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --no-warnings scripts/state.js push

      - name: Отчёт об обходе
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: отчёт
          path: data/nightly
          retention-days: 30
          if-no-files-found: ignore
