<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Топ авторов — FirePacks</title>
	<link rel="icon" href="/favicon.ico" sizes="any">
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<header class="topbar">
		<div class="topbar__inner">
			<a class="brand" href="/" title="На главную страницу библиотеки">
				<span class="brand__mark" aria-hidden="true"><img src="/favicon.ico" alt="" width="30" height="30"></span>
				<span class="brand__text">FirePacks</span>
			</a>

			<a class="topbar__link" href="/">← К библиотеке</a>
			<a class="topbar__link" href="/profile">Профиль →</a>
		</div>
	</header>

	<main class="profile">
		<section class="profile__block">
			<div class="content__head">
				<h1 class="authors__heading" id="heading">Топ авторов паков</h1>

				<label class="toolbar__field">
					<span class="toolbar__label">Период</span>
					<select id="period" class="select">
						<option value="all">За всё время</option>
						<option value="year">За год</option>
						<option value="half">За полгода</option>
						<option value="month">За месяц</option>
					</select>
				</label>
			</div>

			<p class="hint" id="periodHint"></p>

			<div id="table" class="authors"></div>
		</section>
	</main>

	<script src="/common.js"></script>
	<script src="/icons.js"></script>
	<script src="/authors.js"></script>
</body>
</html>
