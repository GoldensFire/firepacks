<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Топ авторов паков SIGame — SIFirePacks</title>
	<meta name="description" content="Кто из авторов паков для «Своей игры» играется больше всех: по сумме запусков всех паков автора и по числу игр в среднем за пак. Поиск по имени, периоды за месяц, полгода и год.">
	<link rel="canonical" href="/authors">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="SIFirePacks">
	<meta property="og:locale" content="ru_RU">
	<meta property="og:title" content="Топ авторов паков SIGame">
	<meta property="og:description" content="Чьи паки для «Своей игры» играют больше всех — по числу запусков и в среднем за пак.">
	<!-- Значок сайта — webp: весит втрое меньше прежнего ico и не мылится
	     на экранах повышенной плотности. Ico остаётся ссылкой ниже ради тех,
	     кто webp не понимает, и лежит по /favicon.ico для закладок и роботов,
	     которые вёрстку не читают вовсе. -->
	<link rel="icon" href="/icon.webp" type="image/webp">
	<link rel="alternate icon" href="/favicon.ico" sizes="any">
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<!-- Шапка одна на весь сайт и на всех страницах одна и та же: те же ссылки
	     в том же порядке, то же поле поиска, те же счётчики, тот же уголок входа.
	     Раньше она у каждой страницы была своя — в библиотеке с поиском, на топах
	     без него, в профиле ещё и без уголка входа, — и при переходе между
	     страницами верхняя строка перекладывалась заново, будто это разные сайты.
	     Ссылка на текущую страницу из неё тоже не убирается: пропадающий пункт
	     сдвигает соседние, и целиться в них приходится каждый раз заново.

	     Наполняет её общий код (см. renderTopbar в web/common.js); правку сюда
	     надо вносить сразу во все web/*.html — тем она и шапка. -->
	<header class="topbar">
		<div class="topbar__inner">
			<a class="brand" href="/" title="На главную страницу библиотеки">
				<span class="brand__mark" aria-hidden="true"><img src="/icon.webp" alt="" width="30" height="30"></span>
				<span class="brand__text">SIFirePacks</span>
			</a>

			<!-- Поиск ищет по нажатию, а не по каждой набранной букве. Пока он искал
			     на ходу, выдача успевала перерисоваться на «бол», «больш», «больша» —
			     три ходки до сервера и три разных списка под руками у того, кто
			     ещё не дописал слово. Форма настоящая, а не для вида: Enter в поле
			     ввода — это её отправка, и отдельно его ловить не приходится.

			     В библиотеке он ищет на месте, на остальных страницах уводит
			     в библиотеку с уже набранным запросом (см. bindTopbarSearch). -->
			<form id="searchBox" class="search-box" role="search">
				<input id="search" class="search" type="search" placeholder="Поиск по названию, автору, тегам, описанию и тексту сообщения" autocomplete="off">
				<!-- Значок нарисован прямо здесь, а не взят из icons.js: тот рисует
				     значки скриптом, а кнопка поиска стоит в шапке и нужна с первого
				     мига — до того, как скрипты вообще загрузились. Чертёж тот же
				     самый: обводка в квадрате 24×24, цвет и размер от текста.

				     Подписи рядом со значком нет: в строке с кнопкой стоят и поле
				     ввода, и счётчики, и уголок входа, и слово «Найти» отнимает
				     у них место без надобности — значок и так читается однозначно.
				     Для того, кто читает голосом, подпись остаётся в aria-label. -->
				<button class="button search-box__button" type="submit" title="Найти" aria-label="Найти">
					<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
						<circle cx="10.6" cy="10.6" r="6.6"/>
						<path d="m15.4 15.4 4.6 4.6"/>
					</svg>
				</button>
			</form>

			<div class="counters" id="counters"></div>

			<a class="topbar__link" href="/top">Топ пакетов</a>
			<a class="topbar__link" href="/authors">Топ авторов</a>
			<!-- Спрятана, пока не пришёл ответ /api/facets: собирать базу можно
			     только дома, а на общем сайте этой кнопки нет вовсе — и узнаётся
			     это оттуда. Раньше она стояла в вёрстке открытой и на хостинге
			     была видна всё время, пока грузилась выдача, а потом пропадала:
			     мигающая чужая кнопка выглядит поломкой. Обратный порядок —
			     спрятать и показать — врёт ровно ноль раз.

			     Кнопки «Задеплоить» рядом больше нет: обновление базы и есть
			     обновление сайта, выбирать между ними нечего (см. src/updater.js). -->
			<a class="topbar__link" id="updateLink" href="/update" hidden>Обновить базу</a>

			<div class="account" id="account"></div>
		</div>
	</header>

	<!-- Оболочка страницы та же, что у топа паков: столбец во всю ширину
	     с общими полями. Раньше здесь стоял класс профиля — от тех времён,
	     когда у профиля была своя раскладка страницы; своей у него больше нет
	     (см. .layout--tabs в style.css), а к топу авторов она и не относилась. -->
	<main class="top">
		<section class="profile__block">
			<div class="content__head">
				<h1 class="authors__heading" id="heading">Топ авторов паков</h1>

				<label class="toolbar__field">
					<span class="toolbar__label">Автор</span>
					<input id="authorSearch" class="select" type="search" placeholder="Найти автора" autocomplete="off">
				</label>

				<label class="toolbar__field">
					<span class="toolbar__label">Сортировка</span>
					<select id="sort" class="select">
						<option value="games">По числу игр</option>
						<option value="average">По играм в среднем за пак</option>
						<option value="packs">По числу паков</option>
					</select>
				</label>

				<label class="toolbar__field">
					<span class="toolbar__label">Период</span>
					<select id="period" class="select">
						<option value="all">За всё время</option>
						<option value="year">За год</option>
						<option value="half">За полгода</option>
						<option value="month">За месяц</option>
					</select>
				</label>
			</div>

			<p class="hint" id="periodHint"></p>

			<div id="table" class="authors"></div>

			<div id="pager" class="pager"></div>
		</section>
	</main>

	<script src="/common.js"></script>
	<script src="/icons.js"></script>
	<script src="/authors.js"></script>
</body>
</html>
