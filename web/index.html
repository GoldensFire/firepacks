<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>FirePacks — библиотека паков для «Своей игры» (SIGame)</title>

	<!-- Описание для поисковой выдачи: это первое, что человек читает под ссылкой,
	     и «FirePacks» ему не говорит ничего. Сказать надо словами, которые он
	     и набирает: паки для Своей игры, скачать, сложность, темы. -->
	<meta name="description" content="Библиотека паков для «Своей игры» (SIGame): более 11 000 пакетов вопросов с уровнем сложности по статистике игр, тематикой, темами и авторами. Поиск по названию, автору и содержимому, отметки о сыгранном, скачивание и игра онлайн.">

	<!-- Адрес относительный нарочно: страница лежит в статике и одинакова дома
	     и на Cloudflare, а раскрывает такую ссылку сам браузер — от того адреса,
	     по которому пришёл. Абсолютный пришлось бы подставлять сервером и держать
	     в двух местах разным. -->
	<link rel="canonical" href="/">

	<meta property="og:type" content="website">
	<meta property="og:site_name" content="FirePacks">
	<meta property="og:locale" content="ru_RU">
	<meta property="og:title" content="FirePacks — библиотека паков для «Своей игры»">
	<meta property="og:description" content="Более 11 000 паков SIGame с уровнем сложности, тематикой и поиском по содержимому.">
	<meta property="og:url" content="/">
	<meta name="twitter:card" content="summary">

	<!-- Подтверждение прав на сайт для Яндекс.Вебмастера. Тем же кодом, что
	     и в файле yandex_….html: у Яндекса это одно и то же значение, и второй
	     способ стоит здесь на случай, если файл однажды потеряется при сборке.
	     У Google код метки другой, чем имя файла, и подставить его отсюда нельзя. -->
	<meta name="yandex-verification" content="42c0743c2b5d2eb6">

	<link rel="icon" href="/favicon.ico" sizes="any">
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<header class="topbar">
		<div class="topbar__inner">
			<a class="brand" href="/" title="На главную страницу библиотеки">
				<span class="brand__mark" aria-hidden="true"><img src="/favicon.ico" alt="" width="30" height="30"></span>
				<span class="brand__text">FirePacks</span>
			</a>

			<input id="search" class="search" type="search" placeholder="Поиск по названию, автору, тегам, описанию и тексту сообщения" autocomplete="off">

			<div class="counters" id="counters"></div>

			<a class="topbar__link" href="/authors">Топ авторов →</a>
			<a class="topbar__link" href="/profile">Профиль →</a>
			<!-- Спрятана, пока не пришёл ответ /api/facets: собирать базу можно
			     только дома, а на общем сайте этой кнопки нет вовсе — и узнаётся
			     это оттуда. Раньше она стояла в вёрстке открытой и на хостинге
			     была видна всё время, пока грузилась выдача, а потом пропадала:
			     мигающая чужая кнопка выглядит поломкой. Обратный порядок —
			     спрятать и показать — врёт ровно ноль раз.

			     Кнопки «Задеплоить» рядом больше нет: обновление базы и есть
			     обновление сайта, выбирать между ними нечего (см. src/updater.js). -->
			<a class="topbar__link" id="updateLink" href="/update" hidden>Обновить базу →</a>

			<div class="account" id="account"></div>
		</div>
	</header>

	<main class="layout">
		<!-- Заголовок страницы. Не видно его нарочно: на экране эту роль давно
		     играет сама выдача с колонкой фильтров, и вторая строка «Библиотека
		     паков» над ними была бы подписью к очевидному. А поисковику и тому,
		     кто читает страницу голосом, заголовок нужен: без него страница
		     начиналась с названия сайта в шапке и слова «Фильтры». -->
		<h1 class="visually-hidden">Библиотека паков для «Своей игры» (SIGame)</h1>

		<section class="content">
			<!-- Сортировка стоит над выдачей, а не в колонке фильтров: она отвечает
			     не на вопрос «какие паки показать», а на вопрос «в каком порядке»,
			     и относится к самому списку, который под ней. -->
			<div class="toolbar">
				<!-- На узком экране колонка фильтров встаёт над выдачей и занимает
				     собой пару экранов: до первого пака при этом надо было долго
				     листать. Поэтому там она свёрнута, а разворачивает её эта кнопка;
				     на широком экране колонка видна всегда, и кнопки нет. -->
				<button id="filtersToggle" class="button filters-toggle" type="button" aria-expanded="false" aria-controls="filters">
					<span>Фильтры</span>
					<span class="filters-toggle__count" id="filtersCount" hidden></span>
				</button>

				<!-- Подписей «Сортировка» и «Порядок» здесь нет: в списке и так
				     написано «Сначала новые», «По названию», «По убыванию», и слово
				     над ним повторяло бы то же самое второй раз. Для тех, кто
				     не видит содержимое списка, остались aria-label. -->
				<label class="toolbar__field">
					<select id="sort" class="select" aria-label="Сортировка">
						<option value="added">Сначала новые</option>
						<option value="popular_week">Популярные за неделю</option>
						<option value="popular_month">Популярные за месяц</option>
						<option value="popular_quarter">Популярные за 3 месяца</option>
						<option value="popular_half">Популярные за полгода</option>
						<option value="popular_year">Популярные за год</option>
						<option value="games">Популярные за всё время</option>
						<option value="rating">По оценке игроков</option>
						<option value="difficulty">По сложности (от сложных)</option>
						<option value="questions">По числу вопросов</option>
						<option value="size">По размеру</option>
						<option value="name">По названию</option>
						<option value="anime">По доле аниме</option>
						<option value="games_share">По доле игр</option>
						<option value="movies">По доле кино и сериалов</option>
						<option value="cartoons">По доле мультиков</option>
						<option value="books">По доле книг</option>
						<option value="music">По доле музыки</option>
						<option value="franchise">По повторам одной франшизы</option>
					</select>
				</label>

				<label class="toolbar__field">
					<select id="dir" class="select" aria-label="Порядок">
						<option value="desc">По убыванию</option>
						<option value="asc">По возрастанию</option>
					</select>
				</label>

				<div id="resultInfo" class="result-info">Загрузка…</div>
			</div>

			<p class="hint" id="sortHint"></p>

			<div class="content__head">
				<div id="activeFilters" class="active-filters"></div>
			</div>

			<div id="grid" class="grid"></div>

			<div id="pager" class="pager"></div>
		</section>

		<aside class="filters" id="filters">
			<section class="filters__block">
				<h2 class="filters__title">Сложность</h2>
				<div id="levels" class="levels"></div>

				<label class="check" id="unratedRow">
					<input type="checkbox" id="unrated" checked>
					<span>Показывать паки без оценки</span>
				</label>
			</section>

			<section class="filters__block">
				<h2 class="filters__title">Тип пака</h2>
				<div id="topics" class="levels"></div>
			</section>

			<!-- Пять основных тематик отвечают на вопрос «о чём вопросы», и на пак
			     про футбол ответа у них нет: спорт живёт в «прочем», ни одна доля
			     порога не берёт, и пак числится солянкой. А пак по Вархаммеру
			     по ним — просто «игропак», каких сотни. Здесь стоят типы, которых
			     в том списке быть не может: их называет разметка тем — тот самый
			     предмет, по которому считаются повторы. -->
			<section class="filters__block">
				<h2 class="filters__title">Пак целиком про одно</h2>
				<input id="subjectSearch" class="select" type="search" placeholder="Найти тип пака" autocomplete="off">
				<div id="subjects" class="levels"></div>
			</section>

			<!-- Язык записан внутри самого файла пака. Указывают его далеко не все,
			     поэтому «Без указания» — такой же полноправный пункт, как русский
			     и английский: спрятать его значило бы спрятать половину базы. -->
			<section class="filters__block">
				<h2 class="filters__title">Язык пака</h2>
				<div id="languages" class="levels"></div>
			</section>

			<section class="filters__block">
				<h2 class="filters__title">Отметки</h2>

				<!-- Стоит отмеченной с самого начала: библиотеку открывают, чтобы выбрать
				     пак на вечер, а сыгранный на этот вопрос уже ответил. Без входа
				     галочка гаснет и снимается — отбирает по отметкам база, а до входа
				     они лежат в самом браузере (см. renderPlayedFilters в web/app.js). -->
				<label class="check">
					<input type="checkbox" id="hidePlayed" checked>
					<span>Скрыть сыгранные</span>
				</label>

				<label class="check">
					<input type="checkbox" id="onlyPlayed">
					<span>Только сыгранные</span>
				</label>

				<!-- Запланированное стоит здесь же: это такая же своя отметка,
				     только про будущее. Полный список отложенного собран в профиле,
				     а тут он нужен, чтобы искать внутри него — по сложности,
				     по типу пака, по числу вопросов. -->
				<label class="check">
					<input type="checkbox" id="onlyPlanned">
					<span>Только запланированные</span>
				</label>
			</section>

			<section class="filters__block">
				<h2 class="filters__title">Темы</h2>
				<input id="tagSearch" class="select" type="search" placeholder="Найти тему" autocomplete="off">
				<div id="tags" class="checklist"></div>
			</section>

			<!-- Отдельного фильтра по повторам франшиз здесь нет: он повторял то,
			     что и так стоит на карточках. Нажатие на повтор в самой карточке
			     по-прежнему показывает все паки с этой франшизой, а снять отбор
			     можно ярлыком над выдачей. -->

			<!-- Чёрный список отсюда убран: он живёт в профиле, вместе с остальным
			     личным. В колонке фильтров ему было не место — снимать оттуда лишнее
			     приходится редко, а места он занимал столько же, сколько настоящие
			     фильтры, которыми пользуются каждый раз. -->

			<button id="reset" class="button button--ghost">Сбросить фильтры</button>
		</aside>
	</main>

	<script src="/common.js"></script>
	<script src="/icons.js"></script>
	<!-- Карточка пака живёт отдельно: ею же нарисована и его собственная
	     страница (/pack/…), см. web/card.js -->
	<script src="/card.js"></script>
	<script src="/app.js"></script>
</body>
</html>
