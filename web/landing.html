<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- Заголовок вкладки, описание для выдачи, канонический адрес и разметку
	     Schema.org сервер подставляет сюда сам, ещё до отправки страницы: рисует-то
	     её скрипт, а читают их из самой вёрстки. Одна и та же вёрстка обслуживает
	     все страницы разделов — и тематики (/topic/anime), и типы паков
	     (/subjects/dota), — а отличаются они ровно тем, что сюда подставлено.
	     См. injectLandingMeta в src/meta.js. -->
	<title>Раздел библиотеки — SIFirePacks</title>
	<!--landing-meta-->
	<!-- Значок вкладки — ico, тот самый icon.ico из корня проекта. Внутри него
	     лежит несколько размеров сразу, и каждое место берёт свой: вкладка —
	     мелкий, закладка — покрупнее, ярлык на рабочем столе — самый большой.
	     Webp этого не умеет: там одна картинка, и во вкладке она пережималась.
	     Он остаётся значком в шапке сайта, рядом с названием, — там размер один
	     и известен заранее. -->
	<link rel="icon" href="/favicon.ico" sizes="any">
	<!-- Тема — до единой нарисованной точки. Скрипт крохотный и стоит прямо
	     в вёрстке нарочно: вынеси его в общий файл — и браузер успел бы нарисовать
	     тёмную страницу, пока тот грузится, а через миг перекрасить её в светлую.
	     Такое моргание при каждом открытии сайта заметнее, чем сама тема.

	     Выбор лежит в самом браузере и переживает закрытие вкладки (см. applyTheme
	     в web/common.js). Ничего не выбрано — остаётся тёмная: сайт открывают
	     вечером, перед игрой. -->
	<script>
		try {
			if (localStorage.getItem('firepacks.theme') === 'light') {
				document.documentElement.dataset.theme = 'light';
			}
		} catch (error) {
			// Хранилище может быть запрещено настройками браузера. Тема тогда
			// просто не запоминается — работает всё остальное.
		}
	</script>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<!-- Шапка одна на весь сайт и на всех страницах одна и та же: те же ссылки
	     в том же порядке, то же поле поиска, те же счётчики, тот же уголок входа.
	     Раньше она у каждой страницы была своя — в библиотеке с поиском, на топах
	     без него, в профиле ещё и без уголка входа, — и при переходе между
	     страницами верхняя строка перекладывалась заново, будто это разные сайты.
	     Ссылка на текущую страницу из неё тоже не убирается: пропадающий пункт
	     сдвигает соседние, и целиться в них приходится каждый раз заново.

	     Наполняет её общий код (см. renderTopbar в web/common.js); правку сюда
	     надо вносить сразу во все web/*.html — тем она и шапка. -->
	<header class="topbar">
		<div class="topbar__inner">
			<a class="brand" href="/" title="На главную страницу библиотеки">
				<span class="brand__mark" aria-hidden="true"><img src="/icon.webp" alt="" width="30" height="30"></span>
				<span class="brand__text">SIFirePacks</span>
			</a>

			<!-- Поиск ищет по нажатию, а не по каждой набранной букве. Пока он искал
			     на ходу, выдача успевала перерисоваться на «бол», «больш», «больша» —
			     три ходки до сервера и три разных списка под руками у того, кто
			     ещё не дописал слово. Форма настоящая, а не для вида: Enter в поле
			     ввода — это её отправка, и отдельно его ловить не приходится.

			     В библиотеке он ищет на месте, на остальных страницах уводит
			     в библиотеку с уже набранным запросом (см. bindTopbarSearch). -->
			<form id="searchBox" class="search-box" role="search">
				<input id="search" class="search" type="search" placeholder="Поиск по названию, автору, тегам, описанию и тексту сообщения" autocomplete="off">
				<!-- Значок нарисован прямо здесь, а не взят из icons.js: тот рисует
				     значки скриптом, а кнопка поиска стоит в шапке и нужна с первого
				     мига — до того, как скрипты вообще загрузились. Чертёж тот же
				     самый: обводка в квадрате 24×24, цвет и размер от текста.

				     Подписи рядом со значком нет: в строке с кнопкой стоят и поле
				     ввода, и счётчики, и уголок входа, и слово «Найти» отнимает
				     у них место без надобности — значок и так читается однозначно.
				     Для того, кто читает голосом, подпись остаётся в aria-label. -->
				<button class="button search-box__button" type="submit" title="Найти" aria-label="Найти">
					<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
						<circle cx="10.6" cy="10.6" r="6.6"/>
						<path d="m15.4 15.4 4.6 4.6"/>
					</svg>
				</button>
			</form>

			<div class="counters" id="counters"></div>

			<a class="topbar__link" href="/top">Топ пакетов</a>
			<a class="topbar__link" href="/authors">Топ авторов</a>
			<!-- Спрятана, пока не пришёл ответ /api/facets: собирать базу можно
			     только дома, а на общем сайте этой кнопки нет вовсе — и узнаётся
			     это оттуда. Раньше она стояла в вёрстке открытой и на хостинге
			     была видна всё время, пока грузилась выдача, а потом пропадала:
			     мигающая чужая кнопка выглядит поломкой. Обратный порядок —
			     спрятать и показать — врёт ровно ноль раз.

			     Кнопки «Задеплоить» рядом больше нет: обновление базы и есть
			     обновление сайта, выбирать между ними нечего (см. src/updater.js). -->
			<a class="topbar__link" id="updateLink" href="/update" hidden>Обновить базу</a>

			<div class="account" id="account"></div>

			<!-- Переключатель темы — справа от уголка входа, последним в шапке:
			     это настройка самого сайта, а не его содержимого. Оба значка
			     нарисованы здесь же, а не берутся из icons.js: кнопка стоит
			     в шапке и нужна с первого мига, до всяких скриптов, — ровно
			     по той же причине, что и значок у кнопки поиска выше. Лишний
			     из двух прячет правило по метке темы (см. .theme-toggle
			     в style.css), а нажатие переставляет метку (см. bindThemeToggle). -->
			<button class="button theme-toggle" id="themeToggle" type="button" title="Светлая тема" aria-label="Включить светлую тему">
				<svg class="icon theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
					<circle cx="12" cy="12" r="4.2"/>
					<path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6"/>
					<path d="m5.4 5.4 1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9"/>
				</svg>
				<svg class="icon theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
					<path d="M20.4 14.6A8.6 8.6 0 0 1 9.4 3.6a8.6 8.6 0 1 0 11 11Z"/>
				</svg>
			</button>
		</div>
	</header>

	<main class="top">
		<div class="top__head">
			<!-- Внутри — заготовка от сервера: заголовок раздела, абзац о нём,
			     список паков ссылками и дорожка в соседние разделы. Скрипт
			     затирает её первым же делом и рисует на этом месте настоящие
			     карточки (см. web/landing.js), поэтому человек её не увидит —
			     ни мельканием, ни вторым списком под настоящим.

			     Тому, кто скриптов не выполняет, — а Яндекс их не выполняет
			     вовсе, — эта заготовка и есть вся страница. -->
			<div id="landing"><!--landing-body--></div>
		</div>

		<div id="list" class="grid"></div>
		<div id="pager" class="pager"></div>
	</main>

	<!--landing-state-->

	<script src="/common.js"></script>
	<script src="/icons.js"></script>
	<script src="/card.js"></script>
	<script src="/landing.js"></script>
</body>
</html>
