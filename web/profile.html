<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Профиль — SIFirePacks</title>
	<!-- Личная страница: у каждого своя, и в поисковой выдаче ей делать нечего.
	     Закрыта дважды — здесь и в robots.txt: robots запрещает обход, а метка
	     запрещает показ, и это разные запреты. Страницу, на которую ведут ссылки
	     со стороны, поисковик показывает в выдаче и не обходя её. -->
	<meta name="robots" content="noindex, nofollow">
	<!-- Значок сайта — webp: весит втрое меньше прежнего ico и не мылится
	     на экранах повышенной плотности. Ico остаётся ссылкой ниже ради тех,
	     кто webp не понимает, и лежит по /favicon.ico для закладок и роботов,
	     которые вёрстку не читают вовсе. -->
	<link rel="icon" href="/icon.webp" type="image/webp">
	<link rel="alternate icon" href="/favicon.ico" sizes="any">
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<!-- Шапка одна на весь сайт и на всех страницах одна и та же: те же ссылки
	     в том же порядке, то же поле поиска, те же счётчики, тот же уголок входа.
	     Раньше она у каждой страницы была своя — в библиотеке с поиском, на топах
	     без него, в профиле ещё и без уголка входа, — и при переходе между
	     страницами верхняя строка перекладывалась заново, будто это разные сайты.
	     Ссылка на текущую страницу из неё тоже не убирается: пропадающий пункт
	     сдвигает соседние, и целиться в них приходится каждый раз заново.

	     Наполняет её общий код (см. renderTopbar в web/common.js); правку сюда
	     надо вносить сразу во все web/*.html — тем она и шапка. -->
	<header class="topbar">
		<div class="topbar__inner">
			<a class="brand" href="/" title="На главную страницу библиотеки">
				<span class="brand__mark" aria-hidden="true"><img src="/icon.webp" alt="" width="30" height="30"></span>
				<span class="brand__text">SIFirePacks</span>
			</a>

			<!-- Поиск ищет по нажатию, а не по каждой набранной букве. Пока он искал
			     на ходу, выдача успевала перерисоваться на «бол», «больш», «больша» —
			     три ходки до сервера и три разных списка под руками у того, кто
			     ещё не дописал слово. Форма настоящая, а не для вида: Enter в поле
			     ввода — это её отправка, и отдельно его ловить не приходится.

			     В библиотеке он ищет на месте, на остальных страницах уводит
			     в библиотеку с уже набранным запросом (см. bindTopbarSearch). -->
			<form id="searchBox" class="search-box" role="search">
				<input id="search" class="search" type="search" placeholder="Поиск по названию, автору, тегам, описанию и тексту сообщения" autocomplete="off">
				<!-- Значок нарисован прямо здесь, а не взят из icons.js: тот рисует
				     значки скриптом, а кнопка поиска стоит в шапке и нужна с первого
				     мига — до того, как скрипты вообще загрузились. Чертёж тот же
				     самый: обводка в квадрате 24×24, цвет и размер от текста.

				     Подписи рядом со значком нет: в строке с кнопкой стоят и поле
				     ввода, и счётчики, и уголок входа, и слово «Найти» отнимает
				     у них место без надобности — значок и так читается однозначно.
				     Для того, кто читает голосом, подпись остаётся в aria-label. -->
				<button class="button search-box__button" type="submit" title="Найти" aria-label="Найти">
					<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
						<circle cx="10.6" cy="10.6" r="6.6"/>
						<path d="m15.4 15.4 4.6 4.6"/>
					</svg>
				</button>
			</form>

			<div class="counters" id="counters"></div>

			<a class="topbar__link" href="/top">Топ пакетов</a>
			<a class="topbar__link" href="/authors">Топ авторов</a>
			<!-- Спрятана, пока не пришёл ответ /api/facets: собирать базу можно
			     только дома, а на общем сайте этой кнопки нет вовсе — и узнаётся
			     это оттуда. Раньше она стояла в вёрстке открытой и на хостинге
			     была видна всё время, пока грузилась выдача, а потом пропадала:
			     мигающая чужая кнопка выглядит поломкой. Обратный порядок —
			     спрятать и показать — врёт ровно ноль раз.

			     Кнопки «Задеплоить» рядом больше нет: обновление базы и есть
			     обновление сайта, выбирать между ними нечего (см. src/updater.js). -->
			<a class="topbar__link" id="updateLink" href="/update" hidden>Обновить базу</a>

			<div class="account" id="account"></div>
		</div>
	</header>

	<!-- Списки паков заняли страницу целиком, а сам профиль уехал в колонку справа.
	     Причина та же, по которой запланированное раньше стояло выше сыгранного:
	     страницу открывают затем, чтобы во что-то сыграть, а не затем, чтобы
	     посмотреть на своё имя и разбивку по тематикам. Списки должны быть под
	     рукой сразу, всё остальное — рядом, но не поперёк дороги. -->
	<main class="profile">
		<div class="profile__main">
			<!-- Запланированное и сыгранное — две вкладки, а не два списка подряд:
			     вместе они на пару тысяч карточек, и вторая половина всё равно
			     жила за пределами экрана. Запланированное открыто по умолчанию —
			     сыгранное это архив, а планы это сегодняшний вечер. -->
			<div class="tabs" role="tablist" aria-label="Что показывать">
				<button class="tab" id="tabPlanned" type="button" role="tab" aria-controls="plannedBlock">
					<span>Запланировано</span>
					<span class="tab__count" id="tabPlannedCount">0</span>
				</button>
				<button class="tab" id="tabPlayed" type="button" role="tab" aria-controls="playedBlock">
					<span>Сыграно</span>
					<span class="tab__count" id="tabPlayedCount">0</span>
				</button>
			</div>

			<!-- Полоса времени: сколько часов стоит за сыгранным. Считается грубо —
			     по 15 секунд на вопрос, — и об этом сказано в подсказке у подписи:
			     число здесь не мерка, а порядок величины. -->
			<section class="timeline" id="timeline">
				<div class="timeline__head">
					<span class="timeline__title" id="timeTitle">Время за паками</span>
					<span class="timeline__value" id="timeValue"></span>
				</div>

				<div class="timeline__bar" id="timeBar"></div>
				<div class="timeline__marks" id="timeMarks"></div>
			</section>

			<!-- Оба списка ходят страницами, как и выдача библиотеки: две сотни
			     отметок — это две сотни полных паков в одном ответе, и страница
			     «во что я играл» открывалась дольше, чем страница со всей
			     библиотекой сразу. Кнопки страниц те же самые (см. renderPages
			     в web/common.js). -->
			<section class="profile__block" id="plannedBlock" role="tabpanel" aria-labelledby="tabPlanned">
				<div class="content__head">
					<div id="plannedInfo" class="result-info"></div>
				</div>

				<div id="plannedGrid" class="grid"></div>

				<div id="plannedPager" class="pager"></div>
			</section>

			<section class="profile__block" id="playedBlock" role="tabpanel" aria-labelledby="tabPlayed" hidden>
				<div class="content__head">
					<div id="resultInfo" class="result-info"></div>
				</div>

				<div id="grid" class="grid"></div>

				<div id="pager" class="pager"></div>
			</section>
		</div>

		<aside class="profile__side">
			<section class="profile__head">
				<div class="profile__who">
					<div class="profile__avatar" id="avatar">?</div>
					<div class="profile__who-text">
						<h1 class="profile__name" id="userName">Гость</h1>
					</div>
				</div>

				<p class="hint" id="userHint"></p>
				<!-- Не «account»: этот номер занят уголком входа в шапке, а она
				     теперь есть и здесь — одна и та же на всех страницах -->
				<div class="profile__account" id="profileAccount"></div>
				<div class="profile__numbers" id="numbers"></div>
			</section>

			<!-- Списки файлом. Нужно это не «на всякий случай»: сыгранное человек
			     ведёт не в одном месте, и до сих пор перенести одно в другое было
			     нечем. Файл называет паки так же, как их называет человек:
			     названием и авторами, — поэтому он и читается глазами,
			     и переживает пересборку базы. -->
			<section class="profile__block">
				<h2 class="filters__title">Список файлом</h2>
				<div class="profile__file">
					<button class="button" id="listExport" type="button"
						title="Скачать сыгранное и запланированное одним файлом JSON">Экспорт</button>
					<button class="button" id="listImport" type="button"
						title="Прочитать такой файл и отметить найденные паки">Импорт</button>
					<input id="listFile" type="file" accept=".json,.txt,application/json,text/plain" hidden>
				</div>
				<!-- Пустая нарочно: строка говорит, чем кончился вывоз или ввоз
				     («в файле 205 паков», «отмечено 12 из 14»), — а до нажатия
				     кнопок говорить ей нечего. Про устройство файла тут стояло
				     объяснение, которое читают один раз, а место оно занимало
				     при каждом открытии страницы -->
				<p class="hint" id="listHint"></p>
			</section>

			<!-- Чёрный список живёт только здесь: в колонке фильтров библиотеки он
			     занимал место рядом с тем, чем пользуются каждый раз, а сам нужен
			     редко — ровно тогда, когда спрятанное надо вернуть. -->
			<section class="profile__block" id="blacklistBlock" hidden>
				<h2 class="filters__title">Чёрный список</h2>
				<!-- Без пояснения под списком: тот, кто пак сюда положил, знает,
				     что это, а крестик рядом с каждой строкой говорит про возврат
				     больше, чем абзац о нём -->
				<div class="profile__chips" id="blacklist"></div>
			</section>

			<section class="profile__block">
				<h2 class="filters__title">Сыграно по сложности</h2>
				<div class="profile__chips" id="levels"></div>
			</section>

			<section class="profile__block">
				<h2 class="filters__title">Сыграно по типу пака</h2>
				<div class="profile__chips" id="topics"></div>
			</section>

			<section class="profile__block" id="authorsBlock" hidden>
				<h2 class="filters__title">Авторы, к которым возвращаешься</h2>
				<div class="profile__chips" id="authors"></div>
			</section>
		</aside>
	</main>

	<script src="/common.js"></script>
	<script src="/icons.js"></script>
	<script src="/profile.js"></script>
</body>
</html>
